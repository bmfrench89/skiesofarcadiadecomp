[project]
name = "soa-port"
version = "0.1.0"
requires-python = ">=3.14"

[project.optional-dependencies]
dev = ["pytest", "ruff", "capstone>=5.0"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
