name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    name: Game data guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # The repository contains code only. This must fail loudly if that ever
      # stops being true. See docs/SPEC.md section 2.
      - name: No game data in working tree
        run: python tools/guard.py

      # A file can be removed in a later commit and still sit in history, where
      # it is just as much a problem. Check every blob that has ever existed.
      # A suffix counts wherever it sits in the file's name, as guard.py's
      # forbidden_suffix has it: slotA.raw.bak is a card image.
      - name: No game data anywhere in history
        run: |
          echo "scanning full history for forbidden blobs..."
          bad=$(git rev-list --objects --all \
            | git cat-file --batch-check='%(objecttype) %(objectname) %(objectsize) %(rest)' \
            | awk '$1=="blob"' \
            | grep -Ei '\.(rvz|iso|gcm|ciso|wbfs|nkit|dol|rel|elf|gvr|tpl|mld|mlk|mll|sml|samp|dsp|sct|std|sst|tec|enp|ect|evp|lmt|bnr|map|bin|raw|fifo|regs|ram|wav|png|gci|gcs|sav|dds|dat|ogg|flac|mp3|opus)(\.[^/]*)?$' \
            || true)
          if [ -n "$bad" ]; then
            echo "::error::game data found in git history"
            echo "$bad"
            exit 1
          fi
          echo "history clean"

      # The step above checks suffixes by blob, and names each blob once, under
      # the first path it was reached by -- so a file renamed to main.dol and
      # back is missed, and the eighteen directory names guard.py refuses in the
      # tree were never checked here at all. This checks every path any commit
      # added or changed against both rules, and its bytes against the tree's
      # content check: a binary that begins as game data, and a file that is
      # not text in a folder that ever held a mod.ini. HISTORY_EXEMPT in
      # guard.py lists the 24 blobs, reviewed one by one, that published
      # history already holds under scratch/.
      - name: No forbidden path or content anywhere in history
        run: python tools/guard.py --history

      - name: No oversized blobs in history
        run: |
          big=$(git rev-list --objects --all \
            | git cat-file --batch-check='%(objecttype) %(objectname) %(objectsize) %(rest)' \
            | awk '$1=="blob" && $3 > 2097152 {print $3, $4}' || true)
          if [ -n "$big" ]; then
            echo "::error::blobs over 2 MiB found in history"
            echo "$big"
            exit 1
          fi
          echo "no oversized blobs"

  test:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: python -m pip install --upgrade pip pytest "ruff==0.16.7"

      # Tests synthesise every fixture in-memory precisely so they can run here,
      # where no disc image exists. Tests needing the real game skip themselves.
      - name: Run tests
        run: python -m pytest tools/tests -q

      - name: Lint
        run: ruff check tools/

      - name: Format check
        run: ruff format --check tools/

  # The C is the port. Everything above this job checks the Python that builds
  # the port, which until now left every line of runtime/ compiled nowhere but
  # the owner's machine -- and a runtime that several agents had edited was
  # found broken by a local build, not by CI.
  #
  # COVERED: every runtime/*.c (28 files today), each compiled on its own with
  # /c and the flags in tools/soa/toolchain.py, plus the handful of warnings
  # that mean a call does not match the function it names (an implicit
  # declaration first among them) promoted to errors, since nothing here
  # links. No file is skipped: the ones that name recompiled or decompiled
  # symbols (main.c, decomp_swap.c, selftest.c) declare them themselves, so
  # nothing needs gen/functions.h to compile, and no stub headers exist under
  # tools/citest/. If a runtime file ever does need generated code, it goes in
  # the UNCOVERED table at the top of tools/citest/compile_runtime.py with a
  # reason, and the job's log names it. Also covered: the six units
  # config/GEAE8P/units.txt marks native (src/sdk/msl/string.c, mem.c,
  # strcpy.c, strcmp.c, fillmem.c and strstr.c), built with the /Ddc_* renames
  # tools/recompile.py derives, linked against runtime/decomp_shims.c and a
  # driver, and checked routine by routine against the host C library --
  # twelve routines, every one a decompiled body: memset reaches fillmem.c's
  # __fill_mem through mem.c's wrapper, and strcmp is checked under its unit's
  # name, fn_8025EF88. And the renderer's own two pixel checks, linked without
  # the game (gx.c, gxr.c, gxr_tev.c, png.c and two stubs) and run: a
  # full-screen quad must cover 307200 pixels and the title screen's cloud
  # triangle must come out whole. The linux job below runs all three under
  # gcc and clang.
  #
  # NOT COVERED, and not claimed to be: linking soa.exe, anything under gen/
  # (recompiling needs the user's own disc, which never exists here), every
  # device model and the guest side of runtime/selftest.c, the mwcc
  # byte-for-byte match (tools/decomp.py needs the vendored compiler), the
  # replay corpus (the captures are game data: tools/scenario.py replay runs
  # that sweep on a machine that has them), and every check that reads
  # extracted/. A green tick here means the C compiles, those MSL routines
  # behave like libc, and the rasterizer still fills a triangle -- nothing
  # about the game running.
  native:
    name: Runtime compiles (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # No toolchain is installed here. windows-latest already ships Visual
      # Studio 2022 with the C++ tools, and tools/soa/toolchain.py finds it
      # through vswhere and runs vcvars64.bat exactly as it does on a
      # developer machine, so CI and the owner's build use the same compiler
      # and the same flags. All three scripts fail loudly rather than skipping
      # when there is no cl.exe, since a check that quietly does nothing is
      # worse than no check.
      #
      # No pip install either: dc_check.py imports tools/recompile.py for one
      # helper, and that import graph is stdlib-only today. That is a real
      # constraint on a file this job does not otherwise touch, so
      # tools/tests/test_citest.py asserts it rather than leaving it to be
      # discovered here.
      - name: Compile every runtime/*.c
        run: python tools/citest/compile_runtime.py

      # Byte-matching a decompiled routine says nothing about how it is called.
      # This links the natively compiled twins to a driver and compares each
      # one with the host C library on generated inputs -- no game data needed.
      - name: Decompiled MSL routines against the host C library
        run: python tools/citest/dc_check.py

      # The only check here that looks at a pixel. Everything above would pass
      # for a renderer that drew nothing at all.
      - name: Renderer pixel checks
        run: python tools/citest/render_check.py

  # The same three checks under a second compiler (portability.md 3.12, L4a).
  # The clang-cl profile in tools/soa/toolchain.py is clang-cl on MSVC's
  # headers, libraries and link.exe, with -ffp-contract=off, -fwrapv and
  # -fno-strict-aliasing; the runner ships LLVM, whose clang-cl
  # compiler_path finds on PATH. Before L2a, gxr_tev.c's SSE4.1 blend did not
  # compile under it at all, and nothing but a local build could have said so.
  #
  # Every check step runs even when one before it failed, so one run shows
  # which of the four a change breaks. The two pytest modules skip, rightly,
  # where there is no clang-cl, llvm-objdump or SSE4.1; here noskip.py makes a
  # skip fail the run, and SOA_CC is what makes test_gxr_fastpath.py build
  # with clang-cl rather than MSVC, which would pass it either way.
  #
  # NOT COVERED: the clang-cl game build and the replay under it (L3b), and
  # everything the native job's comment lists.
  clang-cl:
    name: Runtime compiles (clang-cl)
    runs-on: windows-latest
    env:
      SOA_CC: clang-cl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: python -m pip install --upgrade pip pytest

      # Which clang-cl, and which version, so a runner image that moves LLVM
      # on is visible in the log. No clang-cl here fails the job.
      - name: The clang-cl the checks use
        run: |
          $cc = python -c "import sys; sys.path.insert(0, 'tools'); from soa import toolchain; print(toolchain.compiler_path(toolchain.CLANG_CL) or '')"
          if (-not $cc) { Write-Output "::error::no clang-cl (tools/soa/toolchain.py compiler_path)"; exit 1 }
          Write-Output $cc
          & $cc --version

      - name: Compile every runtime/*.c
        if: ${{ !cancelled() }}
        run: python tools/citest/compile_runtime.py --cc clang-cl

      - name: Decompiled MSL routines against the host C library
        if: ${{ !cancelled() }}
        run: python tools/citest/dc_check.py --cc clang-cl

      - name: Renderer pixel checks
        if: ${{ !cancelled() }}
        run: python tools/citest/render_check.py --cc clang-cl

      # No FMA contraction from either clang profile, and the renderer's
      # specialised pixel paths (the SIMD bilinear blend among them) against
      # the general ones, built with clang-cl.
      - name: FMA probes and fast paths, no skips
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: tools/citest
        run: python -m pytest -p noskip tools/tests/test_toolchain_fp.py tools/tests/test_gxr_fastpath.py -v

  # The same checks under gcc and clang on Linux (portability.md 3.12, L4b).
  # These are the first runs of plat.h's POSIX half -- pthread_create, the
  # futex wait and CLOCK_MONOTONIC -- and of the native twins on a host where
  # long is 64 bits, which is what include/types.h's host branch is for:
  # fillmem.c's and strcpy.c's word loops wrote eight bytes a "word" there
  # before it. render_check asserts the renderer started the workers
  # --threads asked for, and --threads 4 is the POSIX pool's first run. Every
  # check step runs even when one before it failed, as in the clang-cl job.
  #
  # NOT COVERED: linking or running the port itself off Windows (it needs a
  # window and audio that are Win32 today, L12), the replay corpus, and
  # everything the native job's comment lists.
  linux:
    name: Runtime compiles (Linux, ${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: The compiler the checks use
        run: ${{ matrix.cc }} --version

      - name: Compile every runtime/*.c
        if: ${{ !cancelled() }}
        run: python tools/citest/compile_runtime.py --cc ${{ matrix.cc }}

      - name: Decompiled MSL routines against the host C library
        if: ${{ !cancelled() }}
        run: python tools/citest/dc_check.py --cc ${{ matrix.cc }}

      - name: Renderer pixel checks, one worker
        if: ${{ !cancelled() }}
        run: python tools/citest/render_check.py --cc ${{ matrix.cc }} --threads 1

      - name: Renderer pixel checks, four workers (the POSIX pool)
        if: ${{ !cancelled() }}
        run: python tools/citest/render_check.py --cc ${{ matrix.cc }} --threads 4

  # ThreadSanitizer over the render queue (portability.md L8): clang's
  # -fsanitize=thread on render_check at four workers and on queue_check's
  # whole sweep -- every thread count to four, with each stall kind. Every
  # race in a run is reported (halt_on_error=0), and any makes the driver exit
  # non-zero at the end, so the step fails. The
  # renderer's shared counters go through plat.h's seq_cst helpers, which
  # TSAN understands; what it can find is a plain access no helper covers.
  # tools/citest/tsan.supp holds any suppression, each naming its FINDINGS
  # reason. The sysctl: TSAN's memory layout needs fewer random mmap bits
  # than recent Ubuntu runner kernels use, or it dies before main.
  #
  # NOT COVERED: anything outside the renderer -- the device models and the
  # guest threads (threads.c) are not built here.
  tsan:
    name: ThreadSanitizer (render queue)
    runs-on: ubuntu-latest
    env:
      TSAN_OPTIONS: halt_on_error=0 second_deadlock_stack=1 suppressions=${{ github.workspace }}/tools/citest/tsan.supp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Room for TSAN's shadow memory
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: The compiler the checks use
        run: clang --version

      - name: Renderer pixel checks, four workers, under TSAN
        if: ${{ !cancelled() }}
        run: python tools/citest/render_check.py --cc clang --threads 4 --cflag=-fsanitize=thread --cflag=-g --cflag=-DPLAT_TEST_RELAXED_LOADS=1 --out build/citest/render-tsan

      - name: The queue against the one-worker run, under TSAN
        if: ${{ !cancelled() }}
        run: python tools/citest/queue_check.py --cc clang --threads 1,2,3,4 --cflag=-fsanitize=thread --cflag=-g --cflag=-DPLAT_TEST_RELAXED_LOADS=1 --out build/citest/queue-tsan

  # The same checks on ARM64 (portability.md L8): ubuntu-24.04-arm with gcc.
  # x86 orders every load against every earlier one, so a load the queue
  # forgot to order is right there by luck; here it can be wrong, and
  # queue_check holds every thread count and stall to the one-worker run.
  # One run on four cores may still miss a race, which is why the tsan job,
  # not this one, is the oracle for ordering. The windows-11-arm leg the spec
  # once planned is not here: Windows on ARM is outside the owner's targets
  # (PLAN-NEXT section 0).
  arm64-linux:
    name: Runtime compiles (Linux ARM64, gcc)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: The compiler the checks use
        run: gcc --version && uname -m

      - name: Compile every runtime/*.c
        if: ${{ !cancelled() }}
        run: python tools/citest/compile_runtime.py --cc gcc

      - name: Decompiled MSL routines against the host C library
        if: ${{ !cancelled() }}
        run: python tools/citest/dc_check.py --cc gcc

      - name: Renderer pixel checks, four workers
        if: ${{ !cancelled() }}
        run: python tools/citest/render_check.py --cc gcc --threads 4

      - name: The queue against the one-worker run
        if: ${{ !cancelled() }}
        run: python tools/citest/queue_check.py --cc gcc --threads 1,2,3,4
