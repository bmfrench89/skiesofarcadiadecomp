name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    name: Game data guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # The repository contains code only. This must fail loudly if that ever
      # stops being true. See docs/SPEC.md section 2.
      - name: No game data in working tree
        run: python tools/guard.py

      # A file can be removed in a later commit and still sit in history, where
      # it is just as much a problem. Check every blob that has ever existed.
      # A suffix counts wherever it sits in the file's name, as guard.py's
      # forbidden_suffix has it: slotA.raw.bak is a card image.
      - name: No game data anywhere in history
        run: |
          echo "scanning full history for forbidden blobs..."
          bad=$(git rev-list --objects --all \
            | git cat-file --batch-check='%(objecttype) %(objectname) %(objectsize) %(rest)' \
            | awk '$1=="blob"' \
            | grep -Ei '\.(rvz|iso|gcm|ciso|wbfs|nkit|dol|rel|elf|gvr|tpl|mld|mlk|mll|sml|samp|dsp|sct|std|sst|tec|enp|ect|evp|lmt|bnr|map|bin|raw|fifo|regs|ram|wav|png|gci|gcs|sav|dds|dat|ogg|flac|mp3|opus|exe|obj|pdb|so|apk|soadisc)(\.[^/]*)?$' \
            || true)
          if [ -n "$bad" ]; then
            echo "::error::game data found in git history"
            echo "$bad"
            exit 1
          fi
          echo "history clean"

      # The step above checks suffixes by blob, and names each blob once, under
      # the first path it was reached by -- so a file renamed to main.dol and
      # back is missed, and the eighteen directory names guard.py refuses in the
      # tree, and any gen-... folder (R5b), were never checked here at all. This checks every path any commit
      # added or changed against both rules, and its bytes against the tree's
      # content check: a binary that begins as game data, and a file that is
      # not text in a folder that ever held a mod.ini. HISTORY_EXEMPT in
      # guard.py lists the 24 blobs, reviewed one by one, that published
      # history already holds under scratch/.
      - name: No forbidden path or content anywhere in history
        run: python tools/guard.py --history

      - name: No oversized blobs in history
        run: |
          big=$(git rev-list --objects --all \
            | git cat-file --batch-check='%(objecttype) %(objectname) %(objectsize) %(rest)' \
            | awk '$1=="blob" && $3 > 2097152 {print $3, $4}' || true)
          if [ -n "$big" ]; then
            echo "::error::blobs over 2 MiB found in history"
            echo "$big"
            exit 1
          fi
          echo "no oversized blobs"

  test:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: python -m pip install --upgrade pip pytest "ruff==0.16.7"

      # Tests synthesise every fixture in-memory precisely so they can run here,
      # where no disc image exists. Tests needing the real game skip themselves.
      - name: Run tests
        run: python -m pytest tools/tests -q

      - name: Lint
        run: ruff check tools/

      - name: Format check
        run: ruff format --check tools/

  # The C is the port. Everything above this job checks the Python that builds
  # the port, which until now left every line of runtime/ compiled nowhere but
  # the owner's machine -- and a runtime that several agents had edited was
  # found broken by a local build, not by CI.
  #
  # COVERED: every runtime/*.c (39 files today), each compiled on its own with
  # /c and the flags in tools/soa/toolchain.py, plus the handful of warnings
  # that mean a call does not match the function it names (an implicit
  # declaration first among them) promoted to errors, since nothing here
  # links. No file is skipped: the ones that name recompiled or decompiled
  # symbols (main.c, decomp_swap.c, selftest.c) declare them themselves, so
  # nothing needs gen/functions.h to compile, and no stub headers exist under
  # tools/citest/. If a runtime file ever does need generated code, it goes in
  # the UNCOVERED table at the top of tools/citest/compile_runtime.py with a
  # reason, and the job's log names it. Also covered: the six units
  # config/GEAE8P/units.txt marks native (src/sdk/msl/string.c, mem.c,
  # strcpy.c, strcmp.c, fillmem.c and strstr.c), built with the /Ddc_* renames
  # tools/recompile.py derives, linked against runtime/decomp_shims.c and a
  # driver, and checked routine by routine against the host C library --
  # twelve routines, every one a decompiled body: memset reaches fillmem.c's
  # __fill_mem through mem.c's wrapper, and strcmp is checked under its unit's
  # name, fn_8025EF88. And the renderer's own two pixel checks, linked without
  # the game (gx.c, gxr.c, gxr_tev.c, png.c and two stubs) and run: a
  # full-screen quad must cover 307200 pixels and the title screen's cloud
  # triangle must come out whole. The linux job below runs all three under
  # gcc and clang.
  #
  # NOT COVERED, and not claimed to be: linking soa.exe, anything under gen/
  # (recompiling needs the user's own disc, which never exists here), every
  # device model and the guest side of runtime/selftest.c, the mwcc
  # byte-for-byte match (tools/decomp.py needs the vendored compiler), the
  # replay corpus (the captures are game data: tools/scenario.py replay runs
  # that sweep on a machine that has them), and every check that reads
  # extracted/. A green tick here means the C compiles, those MSL routines
  # behave like libc, and the rasterizer still fills a triangle -- nothing
  # about the game running.
  native:
    name: Runtime compiles (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # No toolchain is installed here. windows-latest already ships Visual
      # Studio 2022 with the C++ tools, and tools/soa/toolchain.py finds it
      # through vswhere and runs vcvars64.bat exactly as it does on a
      # developer machine, so CI and the owner's build use the same compiler
      # and the same flags. All three scripts fail loudly rather than skipping
      # when there is no cl.exe, since a check that quietly does nothing is
      # worse than no check.
      #
      # No pip install either: dc_check.py imports tools/recompile.py for one
      # helper, and that import graph is stdlib-only today. That is a real
      # constraint on a file this job does not otherwise touch, so
      # tools/tests/test_citest.py asserts it rather than leaving it to be
      # discovered here.
      # gxv.c, the GPU backend, compiles against Vulkan-Headers, which
      # tools/fetch_gpu.py fetches (pinned, never committed); glslang is not
      # needed, since compile_runtime.py gives gxv.c stand-ins for the SPIR-V.
      # --require-gxv fails the compile step if the backend was not compiled
      # (specs/gpu-backend.md V5).
      - name: Vulkan-Headers for the GPU backend
        run: python tools/fetch_gpu.py --headers

      - name: Compile every runtime/*.c
        run: python tools/citest/compile_runtime.py --require-gxv

      # Byte-matching a decompiled routine says nothing about how it is called.
      # This links the natively compiled twins to a driver and compares each
      # one with the host C library on generated inputs -- no game data needed.
      - name: Decompiled MSL routines against the host C library
        run: python tools/citest/dc_check.py

      # The only check here that looks at a pixel. Everything above would pass
      # for a renderer that drew nothing at all. Since L6 it also holds
      # plat_f2i to cvttss2si over every float and pins a frame drawn from
      # out-of-range conversions.
      - name: Renderer pixel checks
        run: python tools/citest/render_check.py

      # The disc (disc-layer I1): runtime/disc.c built on its own and held to
      # a synthetic image -- the system files it hands back, every read, the
      # file names, and ten images refused in words of their own -- with no
      # game data. --mutate fst-offset is the change that must fail it.
      - name: The disc layer on a synthetic image
        if: ${{ !cancelled() }}
        run: python tools/citest/disc_check.py

      # The renderer's exp2f and log2f (runtime/crmath.h, CORE-MATH), held to
      # correct rounding over every input fog and texture LOD can give them,
      # and their outputs to config/libm.tsv, which every leg has to match
      # (portability.md L6).
      - name: The renderer's exp2f and log2f, every input
        if: ${{ !cancelled() }}
        run: python tools/citest/libm_check.py

  # The same three checks under a second compiler (portability.md 3.12, L4a).
  # The clang-cl profile in tools/soa/toolchain.py is clang-cl on MSVC's
  # headers, libraries and link.exe, with -ffp-contract=off, -fwrapv and
  # -fno-strict-aliasing; the runner ships LLVM, whose clang-cl
  # compiler_path finds on PATH. Before L2a, gxr_tev.c's SSE4.1 blend did not
  # compile under it at all, and nothing but a local build could have said so.
  #
  # Every check step runs even when one before it failed, so one run shows
  # which of the four a change breaks. The two pytest modules skip, rightly,
  # where there is no clang-cl, llvm-objdump or SSE4.1; here noskip.py makes a
  # skip fail the run, and SOA_CC is what makes test_gxr_fastpath.py build
  # with clang-cl rather than MSVC, which would pass it either way.
  #
  # NOT COVERED: the clang-cl game build and the replay under it (L3b), and
  # everything the native job's comment lists.
  clang-cl:
    name: Runtime compiles (clang-cl)
    runs-on: windows-latest
    env:
      SOA_CC: clang-cl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: python -m pip install --upgrade pip pytest

      # Which clang-cl, and which version, so a runner image that moves LLVM
      # on is visible in the log. No clang-cl here fails the job.
      - name: The clang-cl the checks use
        run: |
          $cc = python -c "import sys; sys.path.insert(0, 'tools'); from soa import toolchain; print(toolchain.compiler_path(toolchain.CLANG_CL) or '')"
          if (-not $cc) { Write-Output "::error::no clang-cl (tools/soa/toolchain.py compiler_path)"; exit 1 }
          Write-Output $cc
          & $cc --version

      # gxv.c, the GPU backend, compiles against Vulkan-Headers, which
      # tools/fetch_gpu.py fetches (pinned, never committed); glslang is not
      # needed, since compile_runtime.py gives gxv.c stand-ins for the SPIR-V.
      # --require-gxv fails the compile step if the backend was not compiled
      # (specs/gpu-backend.md V5).
      - name: Vulkan-Headers for the GPU backend
        run: python tools/fetch_gpu.py --headers

      - name: Compile every runtime/*.c
        if: ${{ !cancelled() }}
        run: python tools/citest/compile_runtime.py --cc clang-cl --require-gxv

      - name: Decompiled MSL routines against the host C library
        if: ${{ !cancelled() }}
        run: python tools/citest/dc_check.py --cc clang-cl

      - name: Renderer pixel checks
        if: ${{ !cancelled() }}
        run: python tools/citest/render_check.py --cc clang-cl

      - name: The disc layer on a synthetic image
        if: ${{ !cancelled() }}
        run: python tools/citest/disc_check.py --cc clang-cl

      - name: The renderer's exp2f and log2f, every input
        if: ${{ !cancelled() }}
        run: python tools/citest/libm_check.py --cc clang-cl

      # No FMA contraction from either clang profile, and the renderer's
      # specialised pixel paths (the SIMD bilinear blend among them) against
      # the general ones, built with clang-cl.
      - name: FMA probes and fast paths, no skips
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: tools/citest
        run: python -m pytest -p noskip tools/tests/test_toolchain_fp.py tools/tests/test_gxr_fastpath.py -v

  # Every runtime file compiled for Windows by llvm-mingw, the compiler a
  # player's package carries (specs/distribution.md R1): the pinned release,
  # its Ubuntu-hosted build -- the same compiler, a smaller download --
  # fetched and verified by tools/fetch_mingw.py, and compile_runtime.py's
  # strict set promoting a call that matches nothing to an error, so code only
  # MSVC accepts (an __try, a missing declaration) fails here. It links
  # nothing: the whole build, the self test, the replay and the GPU contrast
  # with gen/mingw/soa.exe run on the owner's machine (test_mingw.py).
  mingw:
    name: Runtime compiles (llvm-mingw)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: llvm-mingw, pinned and verified
        run: |
          python tools/fetch_mingw.py
          python tools/fetch_mingw.py --verify

      - name: The compiler the checks use
        run: vendor/llvm-mingw/bin/x86_64-w64-mingw32-clang --version

      - name: Vulkan-Headers for the GPU backend
        run: python tools/fetch_gpu.py --headers

      - name: Compile every runtime/*.c
        run: python tools/citest/compile_runtime.py --cc mingw --require-gxv

  # R5 (specs/android-sysroot.md R5a): the phone's game library is built by
  # llvm-mingw's clang against this repository's own sysroot, which
  # tools/fetch_android_sysroot.py builds on every machine from bionic's
  # pinned sources -- the 30 headers the translated C reads and the crt
  # objects built from bionic's own source, each held to its pin. On Ubuntu
  # and on Windows, which players build on: both must make the same bytes.
  # Then the game library built through it -- a game of two functions, the
  # C libraries' stubs from config/seam.txt -- checked by tools/soa/elfcheck.py
  # and by runtime/elfcheck.c (gcc on Ubuntu, MSVC on Windows), which must
  # agree. A skip is a failure here.
  android-route:
    name: The Android game library through R5's route (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # the files as git stores them: the runner's Git turns LF into CRLF on Windows (R5-0)
      - name: No line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: python -m pip install --upgrade pip pytest

      - name: llvm-mingw, pinned and verified
        shell: bash
        run: |
          python tools/fetch_mingw.py
          python tools/fetch_mingw.py --verify

      - name: The compilers the checks use
        shell: bash
        run: |
          python -c "import sys; sys.path.insert(0, 'tools'); from soa import toolchain; c = toolchain.mingw_clang(); print(c, toolchain.clang_id(c) if c else 'none')"
          if [ "$RUNNER_OS" = Linux ]; then gcc --version; fi

      # bionic's pinned files, cached on the pins alone (not the script's bytes
      # or line ends), shared across systems, restored by prefix when the pins
      # move: every file is held to its pins when it is read
      - name: The sysroot's cache key
        id: key
        shell: bash
        run: python tools/fetch_android_sysroot.py --cache-key >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: vendor/android-sysroot-src
          key: android-sysroot-src-${{ steps.key.outputs.key }}
          restore-keys: android-sysroot-src-
          enableCrossOsArchive: true

      - name: R5's Android sysroot, built from bionic's pinned sources, and verified
        timeout-minutes: 15
        shell: bash  # -e: a failed --lists fails the step on Windows too, not only --verify
        run: |
          python tools/fetch_android_sysroot.py --lists
          python tools/fetch_android_sysroot.py --verify

      # saved as soon as the fetch has passed, whatever the tests after it do
      - uses: actions/cache/save@v4
        if: steps.restore.outputs.cache-hit != 'true'
        with:
          path: vendor/android-sysroot-src
          key: android-sysroot-src-${{ steps.key.outputs.key }}
          enableCrossOsArchive: true

      - name: The sysroot and the route, no skips
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: tools/citest
          SOA_CC: ${{ runner.os == 'Linux' && 'gcc' || 'msvc' }}
        run: python -m pytest -p noskip tools/tests/test_android_sysroot.py tools/tests/test_android_build.py -v

  # The same checks under gcc and clang on Linux (portability.md 3.12, L4b).
  # These are the first runs of plat.h's POSIX half -- pthread_create, the
  # futex wait and CLOCK_MONOTONIC -- and of the native twins on a host where
  # long is 64 bits, which is what include/types.h's host branch is for:
  # fillmem.c's and strcpy.c's word loops wrote eight bytes a "word" there
  # before it. render_check asserts the renderer started the workers
  # --threads asked for, and --threads 4 is the POSIX pool's first run. Every
  # check step runs even when one before it failed, as in the clang-cl job.
  #
  # L7 adds runtime/plat.c's POSIX half: test_memguard builds main.c's boot
  # path and pokes past the RAM, which only the SIGSEGV guard survives, and
  # threads_check parks and resumes a guest thread on the 32 MB stack the
  # guest runs on. noskip.py makes test_memguard's skip -- no compiler --
  # fail the step, as in the clang-cl job.
  #
  # L10 adds the window and the sound off Windows: window_sdl.c and
  # audio_sdl.c compile with SOA_SDL against SDL3's pinned headers on both
  # legs (--require-sdl), and on the gcc leg SDL3 is built (tools/fetch_sdl.py,
  # the packages it names) and test_window_sdl runs them under Xvfb: the
  # frame read back off the X screen, a key typed with xdotool reaching port
  # 1, a resize, the [present] report, and the sound's drop rule.
  #
  # NOT COVERED: linking or running the port itself off Windows (it needs the
  # player's disc; L10's headless Done ran in a container on the owner's PC),
  # a second guest thread (no fibers off Windows yet), the replay corpus, and
  # everything the native job's comment lists.
  linux:
    name: Runtime compiles (Linux, ${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: python -m pip install --upgrade pip pytest

      - name: The compiler the checks use
        run: ${{ matrix.cc }} --version

      # gxv.c, the GPU backend, compiles against Vulkan-Headers, which
      # tools/fetch_gpu.py fetches (pinned, never committed); glslang is not
      # needed, since compile_runtime.py gives gxv.c stand-ins for the SPIR-V.
      # --require-gxv fails the compile step if the backend was not compiled
      # (specs/gpu-backend.md V5).
      - name: Vulkan-Headers for the GPU backend
        run: python tools/fetch_gpu.py --headers

      # window_sdl.c and audio_sdl.c compile against the pinned source's
      # include/ (tools/fetch_sdl.py --headers); --require-sdl fails the
      # compile step if they were not compiled with SOA_SDL (portability L10)
      - name: SDL3's headers for the window and sound
        run: python tools/fetch_sdl.py --headers

      - name: Compile every runtime/*.c
        if: ${{ !cancelled() }}
        run: python tools/citest/compile_runtime.py --cc ${{ matrix.cc }} --require-gxv --require-sdl

      - name: Decompiled MSL routines against the host C library
        if: ${{ !cancelled() }}
        run: python tools/citest/dc_check.py --cc ${{ matrix.cc }}

      - name: Renderer pixel checks, one worker
        if: ${{ !cancelled() }}
        run: python tools/citest/render_check.py --cc ${{ matrix.cc }} --threads 1

      - name: Renderer pixel checks, four workers (the POSIX pool)
        if: ${{ !cancelled() }}
        run: python tools/citest/render_check.py --cc ${{ matrix.cc }} --threads 4

      - name: The MEM1 guard, no skips
        if: ${{ !cancelled() }}
        env:
          SOA_CC: ${{ matrix.cc }}
          PYTHONPATH: tools/citest
        run: python -m pytest -p noskip tools/tests/test_memguard.py -v

      # portability L9: a mod's mod.so through the real loader (the recording
      # names it; one with no soa_mod_init is refused in dlerror's words), and
      # since L10 each shipped mod built, loaded and switched on; SOA_WAV's
      # file, and soa.ini's search order, built with this leg's compiler; a
      # skip is a failure here
      - name: A mod's mod.so, SOA_WAV and soa.ini off Windows, no skips
        if: ${{ !cancelled() }}
        env:
          SOA_CC: ${{ matrix.cc }}
          PYTHONPATH: tools/citest
        run: python -m pytest -p noskip tools/tests/test_mod_library.py tools/tests/test_audio_wav.py "tools/tests/test_settings.py::test_soa_ini_is_looked_for_at_the_root_then_beside_the_exe_never_the_working_directory" -v

      # specs/android.md L12a: the seam between the runtime and a split game
      # library -- a game of two functions loaded through the real loader and
      # checks, and each refusal before dlopen in the player's words. The case
      # that needs a real split build (gen/, the disc) is left out; a skip of
      # any other is a failure here
      - name: The seam to a split game library, no skips
        if: ${{ !cancelled() }}
        env:
          SOA_CC: ${{ matrix.cc }}
          PYTHONPATH: tools/citest
        run: python -m pytest -p noskip tools/tests/test_seam.py -k "not a_real_split_build" -v

      # specs/android.md L12d: the import's portable half (runtime/import.c),
      # built with this leg's compiler and handed real descriptors -- files,
      # pipes, sockets: what is read in place and what is copied, and the copy
      # checked as it comes, held to its size, kept off a full disk, cancelled
      # and put in place. A skip is a failure here
      - name: The import's copy, no skips
        if: ${{ !cancelled() }}
        env:
          SOA_CC: ${{ matrix.cc }}
          PYTHONPATH: tools/citest
        run: python -m pytest -p noskip tools/tests/test_import.py -v

      # specs/android.md L12c: every runtime file, the SDL window and sound
      # among them, compiled for the phone with the NDK the runner image
      # carries (ANDROID_NDK_HOME), as the APK's Gradle build compiles them.
      # The game library is the android-route job's (R5a).
      - name: The runtime compiled for the phone (the NDK), no skips
        if: ${{ !cancelled() && matrix.cc == 'gcc' }}
        run: python tools/citest/compile_runtime.py --cc android-arm64-ndk --require-gxv --require-sdl

      # portability L10: SDL3 built from its pinned source with the packages
      # tools/fetch_sdl.py names, then the window and sound run on an X
      # display (Xvfb, no window manager); xwd reads the screen back and
      # xdotool types. A skip is a failure here.
      - name: SDL3 built for the window and sound
        if: ${{ !cancelled() && matrix.cc == 'gcc' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev libegl-dev libgl-dev libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev xvfb x11-apps xdotool
          python tools/fetch_sdl.py

      - name: The SDL window and sound under Xvfb, no skips
        if: ${{ !cancelled() && matrix.cc == 'gcc' }}
        env:
          SOA_CC: gcc
          PYTHONPATH: tools/citest
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest -p noskip tools/tests/test_window_sdl.py -v

      - name: A guest thread parks and resumes, on the guest's stack
        if: ${{ !cancelled() }}
        run: python tools/citest/threads_check.py --cc ${{ matrix.cc }}

      # plat_path_kind's stat and plat_fseek64's fseeko: the POSIX half
      - name: The disc layer on a synthetic image
        if: ${{ !cancelled() }}
        run: python tools/citest/disc_check.py --cc ${{ matrix.cc }}

      - name: The renderer's exp2f and log2f, every input
        if: ${{ !cancelled() }}
        run: python tools/citest/libm_check.py --cc ${{ matrix.cc }}

  # ThreadSanitizer over the render queue (portability.md L8): clang's
  # -fsanitize=thread on render_check at four workers and on queue_check's
  # whole sweep -- every thread count to four, with each stall kind. Every
  # race in a run is reported (halt_on_error=0), and any makes the driver exit
  # non-zero at the end, so the step fails. The
  # renderer's shared counters go through plat.h's seq_cst helpers, which
  # TSAN understands; what it can find is a plain access no helper covers.
  # tools/citest/tsan.supp holds any suppression, each naming its FINDINGS
  # reason. The sysctl: TSAN's memory layout needs fewer random mmap bits
  # than recent Ubuntu runner kernels use, or it dies before main.
  #
  # NOT COVERED: anything outside the renderer -- the device models and the
  # guest threads (threads.c) are not built here.
  tsan:
    name: ThreadSanitizer (render queue)
    runs-on: ubuntu-latest
    env:
      TSAN_OPTIONS: halt_on_error=0 second_deadlock_stack=1 suppressions=${{ github.workspace }}/tools/citest/tsan.supp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Room for TSAN's shadow memory
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: The compiler the checks use
        run: clang --version

      - name: Renderer pixel checks, four workers, under TSAN
        if: ${{ !cancelled() }}
        run: python tools/citest/render_check.py --cc clang --threads 4 --cflag=-fsanitize=thread --cflag=-g --out build/citest/render-tsan

      - name: The queue against the one-worker run, under TSAN
        if: ${{ !cancelled() }}
        run: python tools/citest/queue_check.py --cc clang --threads 1,2,3,4 --cflag=-fsanitize=thread --cflag=-g --out build/citest/queue-tsan

  # The same checks on ARM64 (portability.md L8): ubuntu-24.04-arm with gcc.
  # x86 orders every load against every earlier one, so a load the queue
  # forgot to order is right there by luck; here it can be wrong, and
  # queue_check holds every thread count and stall to the one-worker run.
  # One run on four cores may still miss a race, which is why the tsan job,
  # not this one, is the oracle for ordering. The windows-11-arm leg the spec
  # once planned is not here: Windows on ARM is outside the owner's targets
  # (PLAN-NEXT section 0). The MEM1 guard runs here too, because AArch64 says
  # whether a fault was a store only through the ESR record in the signal
  # frame, a different path in plat.c from x86-64's error code.
  arm64-linux:
    name: Runtime compiles (Linux ARM64, gcc)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: python -m pip install --upgrade pip pytest

      - name: The compiler the checks use
        run: gcc --version && uname -m

      # gxv.c, the GPU backend, compiles against Vulkan-Headers, which
      # tools/fetch_gpu.py fetches (pinned, never committed); glslang is not
      # needed, since compile_runtime.py gives gxv.c stand-ins for the SPIR-V.
      # --require-gxv fails the compile step if the backend was not compiled
      # (specs/gpu-backend.md V5).
      - name: Vulkan-Headers for the GPU backend
        run: python tools/fetch_gpu.py --headers

      - name: SDL3's headers for the window and sound
        run: python tools/fetch_sdl.py --headers

      - name: Compile every runtime/*.c
        if: ${{ !cancelled() }}
        run: python tools/citest/compile_runtime.py --cc gcc --require-gxv --require-sdl

      - name: Decompiled MSL routines against the host C library
        if: ${{ !cancelled() }}
        run: python tools/citest/dc_check.py --cc gcc

      - name: Renderer pixel checks, four workers
        if: ${{ !cancelled() }}
        run: python tools/citest/render_check.py --cc gcc --threads 4

      - name: The queue against the one-worker run
        if: ${{ !cancelled() }}
        run: python tools/citest/queue_check.py --cc gcc --threads 1,2,3,4

      - name: The MEM1 guard, no skips
        if: ${{ !cancelled() }}
        env:
          SOA_CC: gcc
          PYTHONPATH: tools/citest
        run: python -m pytest -p noskip tools/tests/test_memguard.py -v

      # portability L9: a mod's mod.so through the real loader (the recording
      # names it; one with no soa_mod_init is refused in dlerror's words), and
      # since L10 each shipped mod built, loaded and switched on; SOA_WAV's
      # file, and soa.ini's search order, built with this leg's compiler; a
      # skip is a failure here
      - name: A mod's mod.so, SOA_WAV and soa.ini off Windows, no skips
        if: ${{ !cancelled() }}
        env:
          SOA_CC: gcc
          PYTHONPATH: tools/citest
        run: python -m pytest -p noskip tools/tests/test_mod_library.py tools/tests/test_audio_wav.py "tools/tests/test_settings.py::test_soa_ini_is_looked_for_at_the_root_then_beside_the_exe_never_the_working_directory" -v

      # specs/android.md L12a, on AArch64, the machine a phone's library is for
      - name: The seam to a split game library, no skips
        if: ${{ !cancelled() }}
        env:
          SOA_CC: gcc
          PYTHONPATH: tools/citest
        run: python -m pytest -p noskip tools/tests/test_seam.py -k "not a_real_split_build" -v

      # specs/android.md L12d, on AArch64, the machine a phone is
      - name: The import's copy, no skips
        if: ${{ !cancelled() }}
        env:
          SOA_CC: gcc
          PYTHONPATH: tools/citest
        run: python -m pytest -p noskip tools/tests/test_import.py -v

      - name: A guest thread parks and resumes, on the guest's stack
        if: ${{ !cancelled() }}
        run: python tools/citest/threads_check.py --cc gcc

      - name: The disc layer on a synthetic image
        if: ${{ !cancelled() }}
        run: python tools/citest/disc_check.py --cc gcc

      - name: The renderer's exp2f and log2f, every input
        if: ${{ !cancelled() }}
        run: python tools/citest/libm_check.py --cc gcc
