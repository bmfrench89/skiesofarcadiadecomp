name: Release

# The player's package (specs/distribution.md R3): built from this commit and
# the pinned downloads -- the embeddable CPython, llvm-mingw, Vulkan-Headers
# and glslang -- with no translated or decompiled game code and no game data
# (SPEC section 2 rule 5), checked by guard.py --tree once unzipped, its build
# imported by its own python and its baked inputs held to this commit's
# (R5-0), the phone's sysroot built from the package's own sources by its own
# python and clang, offline, as a player's PC builds it (R5b), and left as a
# DRAFT release for the owner to publish. On a version tag, and by hand:
#   gh workflow run release.yml --ref <branch>
# Each step runs only if every step before it passed, so a package the guard
# refuses is never drafted.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package, guard and draft
    runs-on: windows-latest
    steps:
      # R5-0: the commit's bytes, not the runner's line endings. Git on this
      # runner converts LF to CRLF on checkout, so every package carried CRLF
      # files; baked= now reads CRLF as LF, and this keeps the files the
      # commit's as well. The second line prints where each setting comes from.
      - name: Check out without converting line endings
        run: |
          git config --global core.autocrlf false
          git config --show-origin --get-all core.autocrlf
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe names a version from the tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: python -m pip install --upgrade pip pytest "ruff==0.16.7"

      - name: The tests
        run: python -m pytest tools/tests -q

      # R1's job: every runtime file compiled by the compiler the package
      # carries, fetched and verified as the package will have it.
      - name: llvm-mingw, pinned and verified
        run: |
          python tools/fetch_mingw.py
          python tools/fetch_mingw.py --verify

      - name: The GPU build files (Vulkan-Headers and glslang), pinned
        run: python tools/fetch_gpu.py

      # R5b: bionic's pinned files, which the package carries for the player's
      # PC to build the phone's sysroot from. Restored from the cache CI's
      # android-route job saves, keyed on the pins alone; a tag's run finds
      # main's, and saves none, since a tag's cache serves no later run.
      - name: The sysroot's cache key
        id: key
        shell: bash
        run: python tools/fetch_android_sysroot.py --cache-key >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: vendor/android-sysroot-src
          key: android-sysroot-src-${{ steps.key.outputs.key }}
          restore-keys: android-sysroot-src-
          enableCrossOsArchive: true

      - name: R5's Android sysroot, built from bionic's pinned sources, and verified
        timeout-minutes: 15
        shell: bash  # -e: a failed --lists fails the step, not only --verify
        run: |
          python tools/fetch_android_sysroot.py --lists
          python tools/fetch_android_sysroot.py --verify

      # The first step's run skipped these, having no llvm-mingw or sysroot
      # yet; here a skip is a failure.
      - name: The Android game library through R5's route
        env:
          PYTHONPATH: tools/citest
        run: python -m pytest -p noskip tools/tests/test_android_sysroot.py tools/tests/test_android_build.py -q

      - name: Every runtime file under llvm-mingw
        run: python tools/citest/compile_runtime.py --cc mingw --require-gxv

      # R4: Setup.exe built as the package builds it, and its checks; the
      # first step's run skipped these, having no llvm-mingw yet, and here a
      # skip is a failure.
      - name: Setup.exe's checks
        run: |
          $out = python -m pytest tools/tests/test_setup.py -q -rs
          $out
          if ($LASTEXITCODE -ne 0 -or ($out -match "skipped")) { exit 1 }

      - name: The package
        run: python tools/package.py --out dist

      # Then Setup.exe's own checks in that folder, which must pass: they
      # look for the package's python, build script, compiler and bionic's
      # sources, so a package laid out otherwise is refused before a player
      # sees it. Then (R5-0) the package's python imports what its build
      # runs, which a package without fetch_sdl.py did not, and package.py
      # check holds its baked inputs to this commit's, since baked= is made of
      # them, and (R5b) its VERSION to its name. Last (R5b), the player's own
      # path to the phone's sysroot: the package's python and clang build it
      # from the package's sources, offline, held to the pins -- into the
      # unzipped folder, after the guard has run, never into the zip.
      - name: The guard, over the package unzipped, Setup's checks, the build's imports and baked inputs, the sysroot
        run: |
          python -c "import glob, zipfile; zipfile.ZipFile(glob.glob('dist/*.zip')[0]).extractall('dist/check')"
          $pkg = (Get-ChildItem dist/check -Directory)[0].FullName
          python tools/guard.py --tree $pkg
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$pkg\Setup.exe" --check | Write-Output
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$pkg\python\python.exe" -I -c "import sys; sys.path.insert(0, r'$pkg\source\tools'); import recompile, player_build, extract, decomp, fetch_gpu, fetch_sdl, fetch_android_sysroot; print('the build imports')"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tools/package.py check $pkg
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$pkg\python\python.exe" "$pkg\source\tools\fetch_android_sysroot.py" --offline
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$pkg\python\python.exe" "$pkg\source\tools\fetch_android_sysroot.py" --verify
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: A draft release, for the owner to publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Get-ChildItem dist/*.zip)[0]
          $sum = Get-Content "$($zip.FullName).sha256"
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "draft-$("${{ github.sha }}".Substring(0, 7))" }
          $notes = "The player's package: extract it to a folder such as C:\Games\Skies, run Setup.exe there and pick your own disc image. $($zip.Length) bytes; sha256 $sum"
          gh release create $tag --draft --target "${{ github.sha }}" --title "$($zip.BaseName)" --notes $notes $zip.FullName "$($zip.FullName).sha256"
