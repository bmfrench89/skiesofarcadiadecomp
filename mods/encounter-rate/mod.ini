# How often random battles come in the field, and hold B for none
# (PLAN-GAMEPLAY-MODS P1). SOA_MODS=mods loads it. SOA_ENCOUNTERS picks the
# rate -- off, half, normal or double; unset is normal -- and
# SOA_ENCOUNTERS_HOLD_B=0 turns hold-B off; soa.ini's `encounters` and
# `encounters_hold_b` say the same. mod.dll is built from mod.c by
# tools/recompile.py --link and never committed.
manifest = 2
id = encounter-rate
version = 1.0
name = Encounter rate
authors = the port's authors
# The least mod API it needs: pad_filter, appended to version 1, is checked
# by the table's size in mod.c.
api = 1
# The DOL this was made for: config/GEAE8P/config.yml pins the same hash.
dol_sha1 = 8c0e278126fa3b0173400fdb632038172743cc13
# Its two settings as options (M16b): soa.ini's `encounter-rate.rate = half`
# and `encounter-rate.hold_b = 0`, or SOA_MOD_OPT. SOA_ENCOUNTERS and
# SOA_ENCOUNTERS_HOLD_B, and soa.ini's `encounters` keys, still win when set.
option = rate enum off|half|normal|double normal
option = hold_b bool 1
