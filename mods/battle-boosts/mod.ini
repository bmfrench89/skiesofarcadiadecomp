# Boosts and assists for every battle (PLAN-GAMEPLAY-MODS R4,
# docs/specs/battle-mods.md): EXP, gold and magic EXP multiplied, full Spirit
# at the start, a Run that always works for the party, and no knock-outs.
# Every option's default is the game's own, and at the defaults the mod
# registers nothing. Set them in soa.ini (`battle-boosts.exp = 2`) or with
# SOA_MOD_OPT. mod.dll is built from mod.c by tools/recompile.py --link and
# never committed.
manifest = 2
id = battle-boosts
version = 1.0
name = Battle boosts and assists
authors = the port's authors
# The least mod API it needs: the battle events (R1), checked by the table's
# size in mod.c.
api = 1
# The DOL this was made for: config/GEAE8P/config.yml pins the same hash.
dol_sha1 = 8c0e278126fa3b0173400fdb632038172743cc13
# EXP, gold and magic EXP times 0 to 4, rounded down; magic EXP held to 127.
option = exp enum 0|0.5|1|1.5|2|3|4 1
option = gold enum 0|0.5|1|1.5|2|3|4 1
option = magic_exp enum 0|0.5|1|1.5|2|3|4 1
# The Spirit gauge full at each battle's first round.
option = full_spirit bool 0
# Run always gets the party away, where the battle lets it run; enemies keep
# their own roll.
option = escape bool 0
# A blow, a death spell or poison leaves a party member at 1 HP instead, so
# a battle ends in a victory or a Run. Not in the one battle whose loss the
# story carries on from (event battle 26, at the home base): there the party
# can fall as ever.
option = no_ko bool 0
