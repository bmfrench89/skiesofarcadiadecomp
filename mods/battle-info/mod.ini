# What a battle does not show, drawn over the picture (PLAN-GAMEPLAY-MODS R5,
# docs/specs/battle-info.md): each living enemy's HP, the round's turn order
# and a log of the round's blows and heals. The party is P1 to P4, the
# enemies A to H, by their places in the battle. Each part is off until set,
# and at the defaults the mod registers nothing. Set them in soa.ini
# (`battle-info.hp = 1`), on the menu's Mods page, or with SOA_MOD_OPT.
# mod.dll is built from mod.c by tools/recompile.py --link and never
# committed.
manifest = 2
id = battle-info
version = 1.0
name = Battle information
authors = the port's authors
# The least mod API it needs: drawing (M20), checked by the table's size in
# mod.c.
api = 1
# The DOL this was made for: config/GEAE8P/config.yml pins the same hash.
dol_sha1 = 8c0e278126fa3b0173400fdb632038172743cc13
# Each living enemy's HP, as numbers and a bar, bottom left.
option = hp bool 0
# The round's turn order, who acts now first, top right, once the game has
# set it (after the party's choices).
option = order bool 0
# The last five things the round did to anyone's HP, bottom right: a blow
# with who struck it, a heal, poison, a knock-out, an escape.
option = log bool 0
# The text's size: 1 on a monitor, 2 on a handheld.
option = size int 1..3 1
