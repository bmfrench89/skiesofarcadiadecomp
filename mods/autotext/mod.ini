# Dialogue that turns its own pages (PLAN-GAMEPLAY-MODS P11). SOA_MODS=mods
# loads it; SOA_AUTOTEXT=on waits 45 frames on a complete page and then
# presses A once, N waits N frames, and unset or 0 is off -- soa.ini's
# `autotext` says the same. Never in a choice box, never over the person's
# own A or B. mod.dll is built from mod.c by tools/recompile.py --link and
# never committed.
manifest = 2
id = autotext
version = 1.0
name = Dialogue auto-advance
authors = the port's authors
# The least mod API it needs: pad_filter, appended to version 1, is checked
# by the table's size in mod.c.
api = 1
# The DOL this was made for: config/GEAE8P/config.yml pins the same hash.
dol_sha1 = 8c0e278126fa3b0173400fdb632038172743cc13
