# Difficulty presets (PLAN-GAMEPLAY-MODS R3, docs/specs/battle-mods.md 4):
# Easy, Hard and Nightmare scale every enemy of a battle as it is made -- HP,
# attack and magic, defense, magic defense, speed -- and the rewards with
# them; ship battles are left as the game has them. Each multiplier can also
# be set on its own, over the preset. The default, normal, is the game's own,
# and at it the mod registers nothing. Set it in soa.ini
# (`difficulty.preset = hard`) or with SOA_MOD_OPT. mod.dll is built from
# mod.c by tools/recompile.py --link and never committed.
manifest = 2
id = difficulty
version = 1.0
name = Difficulty presets
authors = the port's authors
# The least mod API it needs: the battle events (R1), checked by the table's
# size in mod.c.
api = 1
# The DOL this was made for: config/GEAE8P/config.yml pins the same hash.
dol_sha1 = 8c0e278126fa3b0173400fdb632038172743cc13
option = preset enum easy|normal|hard|nightmare normal
# Each `preset` takes the preset's number (the spec's table); a number wins
# over it.
option = hp enum preset|0.25|0.5|0.75|1|1.25|1.5|2|2.5|3|4 preset
option = attack enum preset|0.25|0.5|0.75|1|1.25|1.5|2|2.5|3|4 preset
option = defense enum preset|0.25|0.5|0.75|1|1.25|1.5|2|2.5|3|4 preset
option = magdef enum preset|0.25|0.5|0.75|1|1.25|1.5|2|2.5|3|4 preset
option = speed enum preset|0.25|0.5|0.75|1|1.25|1.5|2|2.5|3|4 preset
option = rewards enum preset|0|0.5|1|1.25|1.5|2|3|4 preset
