# Couch co-op (PLAN-GAMEPLAY-MODS P10b). SOA_MODS=mods loads it; SOA_COOP=1
# gives party slot 1's commands in battle to a second pad, SOA_COOP=1,3 slots
# 1 and 3, and unset is off -- soa.ini's `coop` says the same. Player 1 keeps
# everything else. mod.dll is built from mod.c by tools/recompile.py --link
# and never committed.
manifest = 2
id = coop
version = 1.0
name = Couch co-op
authors = the port's authors
# The least mod API it needs: read_pad, appended to version 1, is checked by
# the table's size in mod.c.
api = 1
# The DOL this was made for: config/GEAE8P/config.yml pins the same hash.
dol_sha1 = 8c0e278126fa3b0173400fdb632038172743cc13
