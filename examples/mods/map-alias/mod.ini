# An example mod for T1's virtual disc (docs/specs/disc-layer.md §3.8, I6):
# map 045 does not exist on the disc, and this mod gives it 002's room and
# script by name, so a warp to 045a lands in 002a's room. Nothing of the
# game's is in this folder: an alias names the player's own file.
manifest = 2
id = map-alias
version = 1.0
name = Map 045 as map 002
authors = the port's authors
api = 1
dol_sha1 = 8c0e278126fa3b0173400fdb632038172743cc13
