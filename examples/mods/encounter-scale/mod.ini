# An example mod for M6's patches: each zone's encounter rate, scaled.
# SOA_MODS=examples/mods loads it, with every other folder there holding a
# mod.ini. mods/encounter-rate is the player's setting for random battles;
# this one is here to show the grammar a pointer and a factor take.
manifest = 2
id = encounter-scale
version = 1.0
name = Encounter rates scaled
authors = the port's authors
# The least mod API it needs: a port that speaks a later one loads it too.
api = 1
# The DOL this was made for: config/GEAE8P/config.yml pins the same hash,
# and a mod made for another build of the game is refused, not guessed at.
dol_sha1 = 8c0e278126fa3b0173400fdb632038172743cc13
# The factor each zone's rate is multiplied by (M16): 0 turns random
# battles off where a map has a table, 1 leaves them as the disc has them.
# soa.ini sets it as `encounter-scale.factor = 1`, and a check as
# SOA_MOD_OPT=encounter-scale.factor=1; any other value refuses the mod.
option = factor enum 0|0.25|0.5|1|2 0.5
